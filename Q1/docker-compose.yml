services:
  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    restart: always
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna123
      POSTGRES_DB: annapurna_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  minio:
    image: quay.io/minio/minio:latest
    container_name: annapurna-minio
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin12345
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
